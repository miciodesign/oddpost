name: Build e pubblica

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Cache immagini articoli
        uses: actions/cache@v4
        with:
          path: static/img/articoli
          key: pixabay-img-v1-${{ hashFiles('content/**/*.md') }}
          restore-keys: |
            pixabay-img-v1-

      - name: Scarica le immagini di copertina (Pixabay)
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python3 scripts/fetch_images.py

      - name: Genera il sito
        run: python3 build.py

      - name: Pubblica nel ramo deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./public
          force_orphan: true
          commit_message: "Sito aggiornato da ${{ github.sha }}"
