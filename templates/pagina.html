{% extends "base.html" %}
{% block description %}{{ page.description or site.description }}{% endblock %}
{% block canonical %}{{ page.url }}{% endblock %}
{% block content %}
<article class="article">
  <header class="article-head">
    <h1 class="article-title">{{ page.title }}</h1>
    {% if page.intro %}<p class="article-summary">{{ page.intro }}</p>{% endif %}
  </header>
  <div class="article-body">
    {{ page.content|safe }}
  </div>
</article>
{% endblock %}
